[workspace]
resolver = "3"
members = [
    "policy-ir",
    "policy-parser",
    "policy-constraints",
    "proof-witness",
    "node-circuit",
    "prove",
    "verify",
]

[workspace.dependencies]
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
anyhow = { version = "1.0", default-features = false }
policy-ir = { path = "./policy-ir" }
rayon = { version = "1.11", default-features = false }
rand_core = { version = "0.6", default-features = false }
# The field and Poseidon: pasta_curves' Fp (the type the PSE fork of halo2
# re-exports) and the PSE Poseidon gadget, used natively and in circuits.
pasta_curves = { version = "0.5" }
halo2_poseidon = { git = "https://github.com/privacy-scaling-explorations/poseidon-gadget", rev = "2478c86285a25c27ee75fd3a000f84b70a8ad231" }
serde_yaml = { version = "0.9.34", default-features = false }
num-bigint = { version = "0.4.6", default-features = false }
blake3 = { version = "1.8.2", default-features = false }
