        </defs><text x="35" y="43" text-anchor="start" font-size="29" font-weight="700" fill="#263238" style=""><tspan x="35" dy="0">Static assurance pipeline: structural analysis, UCP, and finite-field SMT</tspan></text><line x1="35" y1="58" x2="1765" y2="58" stroke="#AAB5BD" stroke-width="1.4" opacity="1"/><rect x="35" y="165" width="220" height="115" rx="12" fill="#F4F6F7" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="145.0" y="193" text-anchor="middle" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="145.0" dy="0">Halo2 circuit</tspan></text><text x="145.0" y="220" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="145.0" dy="0">semantic targets</tspan><tspan x="145.0" dy="22.5">public/private labels</tspan></text><line x1="255" y1="222" x2="330" y2="222" stroke="#536575" stroke-width="2.5" opacity="1" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="330" y="125" width="300" height="195" rx="12" fill="#F4F6F7" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="346" y="153" text-anchor="start" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="346" dy="0">Constraint extraction</tspan></text><text x="346" y="180" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="346" dy="0">gates · selectors · rotations</tspan><tspan x="346" dy="22.5">fixed / advice / instance</tspan><tspan x="346" dy="22.5">copy constraints</tspan><tspan x="346" dy="22.5">lookups when supported</tspan></text><line x1="630" y1="175" x2="715" y2="175" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><line x1="630" y1="270" x2="715" y2="410" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="715" y="105" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#D58A16" stroke-width="2.2" opacity="1"/><text x="731" y="133" text-anchor="start" font-size="21" font-weight="700" fill="#D58A16" style=""><tspan x="731