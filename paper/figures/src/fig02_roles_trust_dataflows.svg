 text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="1465.0" dy="0">same compiler + limits → VK_P</tspan></text><line x1="1465" y1="355" x2="1465" y2="295" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><text x="900" y="575" text-anchor="middle" font-size="22" font-weight="700" fill="#263238" style=""><tspan x="900" dy="0">Trust anchors</tspan></text><rect x="95" y="605" width="290" height="34" rx="17" fill="#F4F6F7" stroke="#536575" stroke-width="1.8" opacity="1"/><text x="240.0" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#536575" style=""><tspan x="240.0" dy="0">Authenticated policy source</tspan></text><rect x="425" y="605" width="290" height="34" rx="17" fill="#F4F6F7" stroke="#536575" stroke-width="1.8" opacity="1"/><text x="570.0" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#536575" style=""><tspan x="570.0" dy="0">Trusted registry / issuer</tspan></text><rect x="755" y="605" width="290" height="34" rx="17" fill="#F4F6F7" stroke="#536575" stroke-width="1.8" opacity="1"/><text x="900.0" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#536575" style=""><tspan x="900.0" dy="0">Compiler + limit profile</tspan></text><rect x="1085" y="605" width="290" height="34" rx="17" fill="#F4F6F7" stroke="#536575" stroke-width="1.8" opacity="1"/><text x="1230.0" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#536575" style=""><tspan x="1230.0" dy="0">VK_P provenance</tspan></text><rect x="1415" y="605" width="290" height="34" rx="17" fill="#F4F6F7" stroke="#536575" stroke-width="1.8" opacity="1"/><text x="1560.0" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#536575" style=""><tspan x="1560.0" dy="0">Public Halo2 parameters</tspan></text><text x="900" y="700" text-anchor="middle" font-size="19" font-weight="700" fill="#263238" style=""><tspan x="900" dy="0">Issuer authentication is outside the circuit; the verifier never receives the private fact or salt.</tspan></text></svg>
