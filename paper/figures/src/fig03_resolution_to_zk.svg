        </defs><text x="35" y="43" text-anchor="start" font-size="29" font-weight="700" fill="#263238" style=""><tspan x="35" dy="0">From a resolution step to a zero-knowledge relation</tspan></text><line x1="35" y1="58" x2="1765" y2="58" stroke="#AAB5BD" stroke-width="1.4" opacity="1"/><text x="40" y="105" text-anchor="start" font-size="27" font-weight="700" fill="#263238" style=""><tspan x="40" dy="0">a</tspan></text><text x="72" y="105" text-anchor="start" font-size="25" font-weight="700" fill="#263238" style=""><tspan x="72" dy="0">Resolution certificate</tspan></text><rect x="40" y="135" width="470" height="300" rx="12" fill="#F4F6F7" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="56" y="163" text-anchor="start" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="56" dy="0">Parent goal</tspan></text><text x="56" y="190" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="56" dy="0">p(t)</tspan></text><rect x="75" y="220" width="180" height="92" rx="12" fill="#FFFFFF" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="165.0" y="248" text-anchor="middle" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="165.0" dy="0">Selected clause</tspan></text><text x="165.0" y="275" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="165.0" dy="0">p(X) ← q₁,…,qₙ</tspan></text><rect x="285" y="220" width="180" height="92" rx="12" fill="#FFFFFF" stroke="#168A83" stroke-width="2.2" opacity="1"/><text x="375.0" y="248" text-anchor="middle" font-size="21" font-weight="700" fill="#168A83" style=""><tspan x="375.0" dy="0">Substitution</tspan></text><text x="375.0" y="275" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="375.0" dy="0">θ: X ↦ t</tspan></text><text x="275" y="360" text-anchor="middle" font-size="19" font-weight="700" fill="#263238" style=""><tspan x="275" dy="0">ordered children  [q₁(t₁), …, qₙ(tₙ)]</tspan></text><text x="275" y="410" text-anchor="middle" font-size="16" font-weight="400" fill="#536575" style="font-style:italic;"><tspan x="275" dy="0">Proof search remains outside the circuit.</tspan></text><line x1="510" y1="280" x2="585" y2="280" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><text x="585" y="105" text-anchor="start" font-size="27" font-weight="700" fill="#263238" style=""><tspan x="585" dy="0">b</tspan></text><text x="617" y="105" text-anchor="start" font-size="25" font-weight="700" fill="#263238" style=""><tspan x="617" dy="0">Public / private partition</tspan></text><rect x="585" y="135" width="330" height="215" rx="12" fill="#EAF2F8" stroke="#245A8D" stroke-width="2.2" opacity="1"/><text x="601" y="163" text-anchor="start" font-size="21" font-weight="700" fill="#245A8D" style=""><tspan x="601" dy="0">Public statement x</tspan></text><text x="601" y="190" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="601" dy="0">fact registry</tspan><tspan x="601" dy="22.5">parent commitment</tspan><tspan x="601" dy="22.5">ordered-child commitment</tspan><tspan x="601" dy="22.5">resolution tag · VK_P context</tspan></text><rect x="585" y="370" width="330" height="215" rx="12" fill="#E8F5F3" stroke="#168A83" stroke-width="2.2" opacity="1"/><text x="601" y="398" text-anchor="start" font-size="21" font-weight="700" fill="#168A83" style=""><tspan x="601" dy="0">Private witness w</tspan></text><text x="601" y="425" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="601" dy="0">typed goals · clause</tspan><tspan x="601" dy="22.5">substitution · term data</tspan><tspan x="601" dy="22.5">fact + salt, or</tspan><tspan x="601" dy="22.5">builtin intermediates</tspan></text><line x1="915" y1="280" x2="1000" y2="280" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><text x="1000" y="105" text-anchor="start" font-size="27" font-weight="700" fill="#263238" style=""><tspan x="1000" dy="0">c</tspan></text><text x="1032" y="105" text-anchor="start" font-size="25" font-weight="700" fill="#263238" style=""><tspan x="1032" dy="0">Halo2 relation</tspan></text><rect x="1000" y="135" width="755" height="450" rx="16" fill="#F4F6F7" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="1377" y="205" text-anchor="middle" font-size="33" font-weight="700" fill="#263238" style=""><tspan x="1377" dy="0">∃ w : R_step(x, w) = 1</tspan></text><rect x="1050" y="260" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="1145.0" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="1145.0" dy="0">valid rule</tspan></text><rect x="1275" y="260" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#7256A8" stroke-width="2.2" opacity="1"/><text x="1370.0" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#7256A8" style=""><tspan x="1370.0" dy="0">valid fact</tspan></text><rect x="1500" y="260" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#D58A16" stroke-width="2.2" opacity="1"/><text x="1595.0" y="288" text-anchor="middle" font-size="21" font-weight="700" fill="#D58A16" style=""><tspan x="1595.0" dy="0">valid builtin</tspan></text><text x="1375" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#263238" style=""><tspan x="1375" dy="0">exactly one branch</tspan></text><line x1="1375" y1="405" x2="1375" y2="475" stroke="#2C8B57" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="1275" y="475" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#2C8B57" stroke-width="2.2" opacity="1"/><text x="1375.0" y="503" text-anchor="middle" font-size="21" font-weight="700" fill="#2C8B57" style=""><tspan x="1375.0" dy="0">Local proof π</tspan></text><text x="1375.0" y="530" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="1375.0" dy="0">w remains hidden</tspan></text><text x="900" y="660" text-anchor="middle" font-size="20" font-weight="700" fill="#263238" style=""><tspan x="900" dy="0">The circuit validates a bounded certificate; it does not execute Prolog search.</tspan></text></svg>
