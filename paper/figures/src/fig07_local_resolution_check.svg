<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="68mm" viewBox="0 0 1800 680"><rect width="100%" height="100%" fill="#FFFFFF"/><defs>
          <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3.5 L0,7 Z" fill="#263238"/></marker>
          <marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M8,0 L0,3.5 L8,7 Z" fill="#263238"/></marker>
          <style>text { font-family: Arial, Helvetica, 'Liberation Sans', sans-serif; } line,path,rect { vector-effect: non-scaling-stroke; }</style>
        </defs><text x="35" y="43" text-anchor="start" font-size="29" font-weight="700" fill="#263238" style=""><tspan x="35" dy="0">Checking one proof-tree step</tspan></text><line x1="35" y1="58" x2="1765" y2="58" stroke="#AAB5BD" stroke-width="1.4" opacity="1"/><rect x="35" y="160" width="270" height="260" rx="12" fill="#F4F6F7" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="170.0" y="188" text-anchor="middle" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="170.0" dy="0">Local node</tspan></text><text x="170.0" y="215" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="170.0" dy="0">public: parent + children</tspan><tspan x="170.0" dy="22.5">public: resolution tag</tspan><tspan x="170.0" dy="22.5">private: certificate data</tspan></text><line x1="305" y1="290" x2="385" y2="290" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="385" y="100" width="440" height="120" rx="12" fill="#FFFFFF" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="401" y="128" text-anchor="start" font-size="21" font-weight="700" fill="#536575" style=""><tspan x="401" dy="0">Valid policy rule?</tspan></text><text x="401" y="155" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="401" dy="0">real clause candidate</tspan><tspan x="401" dy="22.5">pattern / signature</tspan><tspan x="401" dy="22.5">variable consistency</tspan></text><rect x="765" y="178" width="42" height="30" rx="15.0" fill="#FFFFFF" stroke="#536575" stroke-width="1.7" opacity="1"/><text x="786.0" y="199.12" text-anchor="middle" font-size="18" font-weight="700" fill="#536575" style=""><tspan x="786.0" dy="0">r</tspan></text><line x1="825" y1="160" x2="925" y2="290" stroke="#536575" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="385" y="255" width="440" height="120" rx="12" fill="#FFFFFF" stroke="#7256A8" stroke-width="2.2" opacity="1"/><text x="401" y="283" text-anchor="start" font-size="21" font-weight="700" fill="#7256A8" style=""><tspan x="401" dy="0">Authorized fact?</tspan></text><text x="401" y="310" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="401" dy="0">typed digest</tspan><tspan x="401" dy="22.5">registry membership</tspan></text><rect x="765" y="333" width="42" height="30" rx="15.0" fill="#FFFFFF" stroke="#7256A8" stroke-width="1.7" opacity="1"/><text x="786.0" y="354.12" text-anchor="middle" font-size="18" font-weight="700" fill="#7256A8" style=""><tspan x="786.0" dy="0">f</tspan></text><line x1="825" y1="315" x2="925" y2="290" stroke="#7256A8" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="385" y="410" width="440" height="120" rx="12" fill="#FFFFFF" stroke="#D58A16" stroke-width="2.2" opacity="1"/><text x="401" y="438" text-anchor="start" font-size="21" font-weight="700" fill="#D58A16" style=""><tspan x="401" dy="0">Correct builtin?</tspan></text><text x="401" y="465" text-anchor="start" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="401" dy="0">operator semantics</tspan><tspan x="401" dy="22.5">arithmetic / comparison</tspan><tspan x="401" dy="22.5">range constraints</tspan></text><rect x="765" y="488" width="42" height="30" rx="15.0" fill="#FFFFFF" stroke="#D58A16" stroke-width="1.7" opacity="1"/><text x="786.0" y="509.12" text-anchor="middle" font-size="18" font-weight="700" fill="#D58A16" style=""><tspan x="786.0" dy="0">b</tspan></text><line x1="825" y1="470" x2="925" y2="290" stroke="#D58A16" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="925" y="200" width="350" height="180" rx="12" fill="#F4F6F7" stroke="#536575" stroke-width="2.2" opacity="1"/><text x="1100" y="235" text-anchor="middle" font-size="22" font-weight="700" fill="#263238" style=""><tspan x="1100" dy="0">Exclusive resolution</tspan></text><text x="1100" y="285" text-anchor="middle" font-size="25" font-weight="700" fill="#263238" style=""><tspan x="1100" dy="0">r, f, b ∈ {0, 1}</tspan></text><text x="1100" y="330" text-anchor="middle" font-size="29" font-weight="700" fill="#2C8B57" style=""><tspan x="1100" dy="0">r + f + b = 1</tspan></text><rect x="955" y="420" width="290" height="72" rx="12" fill="#EAF2F8" stroke="#245A8D" stroke-width="2.2" opacity="1"/><text x="1100.0" y="448" text-anchor="middle" font-size="21" font-weight="700" fill="#245A8D" style=""><tspan x="1100.0" dy="0">Bind public tag</tspan></text><text x="1100.0" y="475" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="1100.0" dy="0">tag = r + 2f + 3b</tspan></text><line x1="1100" y1="380" x2="1100" y2="420" stroke="#245A8D" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><line x1="1275" y1="290" x2="1375" y2="290" stroke="#2C8B57" stroke-width="2.5" opacity="1" marker-end="url(#arrow)"/><rect x="1375" y="225" width="350" height="130" rx="12" fill="#FFFFFF" stroke="#2C8B57" stroke-width="2.2" opacity="1"/><text x="1550.0" y="253" text-anchor="middle" font-size="21" font-weight="700" fill="#2C8B57" style=""><tspan x="1550.0" dy="0">Local step accepted</tspan></text><text x="1550.0" y="280" text-anchor="middle" font-size="18" font-weight="400" fill="#263238" style=""><tspan x="1550.0" dy="0">output: independent proof π</tspan></text><text x="900" y="625" text-anchor="middle" font-size="20" font-weight="700" fill="#263238" style=""><tspan x="900" dy="0">Exactly one implemented semantic branch must validate the same committed local statement.</tspan></text></svg>
