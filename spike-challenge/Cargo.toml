[package]
name = "spike-challenge"
version = "0.1.0"
edition = "2024"
description = "Step 2 spike: Batchman branch compression with a Halo2 challenge (PSE fork)"
publish = false

# A workspace of its own: the spike uses the PSE fork of halo2_proofs, which
# must not leak into the main workspace's Cargo.lock.
[workspace]

[dependencies]
# PSE fork: multi-phase advice columns and challenges (`challenge_usable_after`).
# `circuit-params` lets the circuit width come from the policy at run time.
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", tag = "v0.3.0", features = ["circuit-params"] }
# Poseidon chip for the PSE fork (same P128Pow5T3 constants as zcash's halo2_gadgets).
halo2_poseidon = { git = "https://github.com/privacy-scaling-explorations/poseidon-gadget", rev = "2478c86285a25c27ee75fd3a000f84b70a8ad231" }
ff = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
anyhow = "1"
serde_json = "1"

# The real policy and proof tree. Their field type is pasta_curves' Fp, the
# same type the PSE fork re-exports as halo2curves::pasta::Fp.
policy-ir = { path = "../policy-ir" }
policy-constraints = { path = "../policy-constraints" }
proof-witness = { path = "../proof-witness" }

[profile.test]
opt-level = 3
